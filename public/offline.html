<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — St. Peter's Marketplace</title>
  <meta name="theme-color" content="#B8382B" />
  <style>
    :root {
      --primary: #B8382B;
      --gray-50: #F8FAFC;
      --gray-100: #F1F5F9;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-900: #0F172A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--gray-50);
      color: var(--gray-900);
      text-align: center;
    }
    .icon-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 9999px;
      background-color: var(--gray-100);
      color: var(--gray-400);
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: var(--gray-500); margin-bottom: 1.5rem; max-width: 380px; }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      background-color: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background-color: #B33D25; }
  </style>
</head>
<body>
  <main>
    <span class="icon-circle">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M5 12.9a10 10 0 0 1 3.5-2.3"/>
        <path d="M15.5 10.6a10 10 0 0 1 3.5 2.3"/>
        <path d="M2 8.8a15 15 0 0 1 5-3"/>
        <path d="M17 5.8a15 15 0 0 1 5 3"/>
        <path d="M12 20h.01"/>
      </svg>
    </span>
    <h1>You're Offline</h1>
    <p>
      St. Peter's Marketplace needs a connection to load new listings.
      Pages you've already visited are still available.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </main>
</body>
</html>

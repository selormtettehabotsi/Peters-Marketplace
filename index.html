<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the layout read the phone's safe areas (home
       indicator, gesture bar), so the bottom tab bar sits above them -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- SEO -->
  <title>St. Peter's Marketplace | Buy &amp; Sell at Kotei</title>
  <meta name="description" content="The marketplace for St. Peter's Hostel residents. Buy and sell textbooks, electronics, food, clothing, and services." />
  <meta name="keywords" content="St Peters Hostel, Kotei, KNUST, marketplace, buy, sell, students" />

  <!-- PWA -->
  <meta name="theme-color" content="#F3F0E8" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SP Market" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Fonts (preconnect for speed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>
<body>
  <!-- App Shell -->
  <div id="app">
    <nav id="navbar"></nav>
    <main id="page-content"></main>
    <footer id="footer"></footer>
  </div>

  <!-- Toast container for notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
